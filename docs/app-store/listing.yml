# App Review Information. Leave phone blank and set the APP_REVIEW_PHONE
# repository secret instead (it wins over this field).
review:
  first_name: Felix
  last_name: Dantoni
  email: hello@perfectink.org
  phone: ""
  demo_required: false   # no sign-in, so no demo account
  notes: |
    Composer is a music theory and composition app. It needs no permissions, no account and no network access.

    HOW TO TEST
    1. Chord Progressions is selected at launch. Click Generate, then Play to hear the progression.
    2. Under MIDI Export, click "Export .mid…" and save the file anywhere. This is the only place Composer writes a file, through the standard save panel.
    3. In the sidebar, open Circle of Fifths and click a key, then Scales & Modes and Chord Dictionary.
    4. Open Piano and press the A to L keys on your keyboard to play notes.
    5. Open Ear Training and answer a few questions.

    ABOUT THE BUILD
    The app is sandboxed with one entitlement: read/write access to files the user picks in the save panel. Sound comes from the General MIDI sound bank built into macOS. No data is collected. Purchases: none.

    Contact for questions during review: hello@perfectink.org
